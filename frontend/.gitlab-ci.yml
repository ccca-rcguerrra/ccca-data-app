image: docker:27

stages:
  - build-deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# ── BUILD & DEPLOY ────────────────────────────────────────────────────────────

build-deploy:staging:
  stage: build-deploy
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
    PROJECT_NAME: $STG_PROJECT_NAME
    MB_ALERTA_WS_FRONTEND_PORT: $STG_MB_ALERTA_WS_FRONTEND_PORT
    MB_ALERTA_WS_HOST_IP: $STG_MB_ALERTA_WS_HOST_IP
    MB_ALERTA_WS_HOST_SSH_USER: $STG_MB_ALERTA_WS_HOST_SSH_USER
    MB_ALERTA_WS_HOST_SSH_PRIVATE_KEY: $STG_MB_ALERTA_WS_HOST_SSH_PRIVATE_KEY

  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --name ci-builder
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - |
      if [ -f "$MB_ALERTA_WS_HOST_SSH_PRIVATE_KEY" ]; then
        SSH_PRIVATE_KEY="$(cat "$MB_ALERTA_WS_HOST_SSH_PRIVATE_KEY")"
      else
        SSH_PRIVATE_KEY="$MB_ALERTA_WS_HOST_SSH_PRIVATE_KEY"
      fi
      SSH_PRIVATE_KEY="$(printf '%s' "$SSH_PRIVATE_KEY" | sed "s/^'//; s/'$//")"
      printf '%b\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    - ssh-keyscan -H "$MB_ALERTA_WS_HOST_IP" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

  script:
    - |
      docker buildx build \
        --provenance=false \
        --build-arg VITE_API_BASE_URL="$STG_VITE_API_BASE_URL" \
        --build-arg VITE_WS_URL="$STG_VITE_WS_URL" \
        --build-arg VITE_APP_TITLE="$STG_VITE_APP_TITLE" \
        --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache" \
        --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max" \
        --tag "$CI_REGISTRY_IMAGE:staging" \
        --output type=image,push=true,oci-mediatypes=false \
        .
    - export DOCKER_HOST="ssh://${MB_ALERTA_WS_HOST_SSH_USER}@${MB_ALERTA_WS_HOST_IP}"
    - docker compose -p $PROJECT_NAME -f deploy/docker-compose.staging.yml pull
    - docker compose -p $PROJECT_NAME -f deploy/docker-compose.staging.yml up -d mapbiomas-alertas-workspace-frontend

  environment:
    name: staging
    url: http://$MB_ALERTA_WS_HOST_IP

  only:
    - staging

