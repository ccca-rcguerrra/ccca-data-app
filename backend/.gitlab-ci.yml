image: docker:27

stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# ── BUILD ─────────────────────────────────────────────────────────────────────
# Image is identical across every environment (no per-env build args), so it is
# built and pushed once per pipeline. Deploy jobs only pull it on the host.

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --name ci-builder
  script:
    - |
      docker buildx build \
        --provenance=false \
        --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache" \
        --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max" \
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" \
        --tag "$CI_REGISTRY_IMAGE:latest" \
        --output type=image,push=true,oci-mediatypes=false \
        .
  only:
    - staging
    - bra-prod
    - per-prod
    - col-prod
    - bol-prod
    - idn-prod
    - production

# ── DEPLOY ────────────────────────────────────────────────────────────────────
# One job per initiative. Pulls the image built above on the remote host over SSH
# and (re)starts the backend service via docker compose.

deploy:staging:
  stage: deploy
  image: docker:27
  needs:
    - build
  variables:
    NODE_ENV: $NODE_ENV
    PROJECT_NAME: $STG_PROJECT_NAME
    MB_ALERTA_WS_BACKEND_PORT: $STG_MB_ALERTA_WS_BACKEND_PORT
    MB_ALERTA_WS_BACKEND_AUTH_SECRET: $STG_MB_ALERTA_WS_BACKEND_AUTH_SECRET
    MB_ALERTA_WS_INITIATIVE: $STG_MB_ALERTA_WS_INITIATIVE
    MB_ALERTA_WS_APP_CONFIG_PATH: $STG_MB_ALERTA_WS_APP_CONFIG_PATH
    MB_ALERTA_WS_GEOM_SRID: $STG_MB_ALERTA_WS_GEOM_SRID
    MB_ALERTA_WS_ALERT_GEOM_NEW_CROSSINGS_FIELD: $STG_MB_ALERTA_WS_ALERT_GEOM_NEW_CROSSINGS_FIELD
    MB_ALERTA_WS_ALERT_IMAGES_PATH_PREFIX: $STG_MB_ALERTA_WS_ALERT_IMAGES_PATH_PREFIX
    MB_ALERTA_WS_BACKEND_DB_HOST: $STG_MB_ALERTA_WS_BACKEND_DB_HOST
    MB_ALERTA_WS_BACKEND_DB_PORT: $STG_MB_ALERTA_WS_BACKEND_DB_PORT
    MB_ALERTA_WS_BACKEND_DB_NAME: $STG_MB_ALERTA_WS_BACKEND_DB_NAME
    MB_ALERTA_WS_BACKEND_DB_USER: $STG_MB_ALERTA_WS_BACKEND_DB_USER
    MB_ALERTA_WS_BACKEND_DB_PASSWORD: $STG_MB_ALERTA_WS_BACKEND_DB_PASSWORD
    MB_ALERTA_WS_REDIS_HOST: $STG_MB_ALERTA_WS_REDIS_HOST
    MB_ALERTA_WS_REDIS_PORT: $STG_MB_ALERTA_WS_REDIS_PORT
    MB_ALERTA_WS_BACKEND_REDIS_DB: $STG_MB_ALERTA_WS_BACKEND_REDIS_DB
    MB_ALERTA_WS_BACKEND_REDIS_PREFIX: $STG_MB_ALERTA_WS_BACKEND_REDIS_PREFIX
    MB_ALERTA_WS_BACKEND_GOOGLE_APPLICATION_CREDENTIALS: $STG_MB_ALERTA_WS_BACKEND_GOOGLE_APPLICATION_CREDENTIALS
    MB_ALERTA_WS_BACKEND_GOOGLE_PROJECT_ID: $STG_MB_ALERTA_WS_BACKEND_GOOGLE_PROJECT_ID
    MB_ALERTA_WS_BACKEND_GS_BUCKET_NAME: $STG_MB_ALERTA_WS_BACKEND_GS_BUCKET_NAME
    MB_ALERTA_WS_ALERT_IMAGES_GS_BUCKET_NAME: $STG_MB_ALERTA_WS_ALERT_IMAGES_GS_BUCKET_NAME
    MB_ALERTA_ALERT_IMAGES_PNG_BASE_URL: $STG_MB_ALERTA_ALERT_IMAGES_PNG_BASE_URL
    MB_ALERTA_DASHBOARD_GRAPHQL_URL: $STG_MB_ALERTA_DASHBOARD_GRAPHQL_URL
    MB_ALERTA_DASHBOARD_EMAIL: $STG_MB_ALERTA_DASHBOARD_EMAIL
    MB_ALERTA_DASHBOARD_PASSWORD: $STG_MB_ALERTA_DASHBOARD_PASSWORD
    MB_ALERTA_WS_SMTP_HOST: $STG_MB_ALERTA_WS_SMTP_HOST
    MB_ALERTA_WS_SMTP_PORT: $STG_MB_ALERTA_WS_SMTP_PORT
    MB_ALERTA_WS_SMTP_SECURE: $STG_MB_ALERTA_WS_SMTP_SECURE
    MB_ALERTA_WS_SMTP_USER: $STG_MB_ALERTA_WS_SMTP_USER
    MB_ALERTA_WS_SMTP_PASS: $STG_MB_ALERTA_WS_SMTP_PASS
    MB_ALERTA_WS_MAIL_FROM: $STG_MB_ALERTA_WS_MAIL_FROM
    MB_ALERTA_WS_FRONTEND_URL: $STG_MB_ALERTA_WS_FRONTEND_URL
