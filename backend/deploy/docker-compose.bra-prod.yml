version: "3.5"

services:
  mapbiomas-alertas-workspace-backend:
    image: registry.gitlab.com/mapbiomas/alertas/workspace/alertas-workspace-backend:latest
    container_name: mapbiomas-alertas-workspace-backend-bra-prod
    hostname: mapbiomas-alertas-workspace-backend-bra-prod
    restart: always
    environment:
      NODE_ENV: production
      PROJECT_NAME: ${PROJECT_NAME}
      MB_ALERTA_WS_BACKEND_PORT: ${MB_ALERTA_WS_BACKEND_PORT}
      MB_ALERTA_WS_BACKEND_AUTH_SECRET: ${MB_ALERTA_WS_BACKEND_AUTH_SECRET}
      MB_ALERTA_WS_INITIATIVE: ${MB_ALERTA_WS_INITIATIVE}
      MB_ALERTA_WS_APP_CONFIG_PATH: ${MB_ALERTA_WS_APP_CONFIG_PATH}
      MB_ALERTA_WS_GEOM_SRID: ${MB_ALERTA_WS_GEOM_SRID}
      MB_ALERTA_WS_ALERT_GEOM_NEW_CROSSINGS_FIELD: ${MB_ALERTA_WS_ALERT_GEOM_NEW_CROSSINGS_FIELD}
      MB_ALERTA_WS_ALERT_IMAGES_PATH_PREFIX: ${MB_ALERTA_WS_ALERT_IMAGES_PATH_PREFIX}
      MB_ALERTA_WS_BACKEND_DB_HOST: ${MB_ALERTA_WS_BACKEND_DB_HOST}
      MB_ALERTA_WS_BACKEND_DB_PORT: ${MB_ALERTA_WS_BACKEND_DB_PORT}
      MB_ALERTA_WS_BACKEND_DB_NAME: ${MB_ALERTA_WS_BACKEND_DB_NAME}
      MB_ALERTA_WS_BACKEND_DB_USER: ${MB_ALERTA_WS_BACKEND_DB_USER}
      MB_ALERTA_WS_BACKEND_DB_PASSWORD: ${MB_ALERTA_WS_BACKEND_DB_PASSWORD}
      MB_ALERTA_WS_REDIS_HOST: ${MB_ALERTA_WS_REDIS_HOST}
      MB_ALERTA_WS_REDIS_PORT: ${MB_ALERTA_WS_REDIS_PORT}
      MB_ALERTA_WS_BACKEND_REDIS_DB: ${MB_ALERTA_WS_BACKEND_REDIS_DB}
      MB_ALERTA_WS_BACKEND_REDIS_PREFIX: ${MB_ALERTA_WS_BACKEND_REDIS_PREFIX}
      MB_ALERTA_WS_BACKEND_GOOGLE_APPLICATION_CREDENTIALS: ${MB_ALERTA_WS_BACKEND_GOOGLE_APPLICATION_CREDENTIALS}
      MB_ALERTA_WS_BACKEND_GOOGLE_PROJECT_ID: ${MB_ALERTA_WS_BACKEND_GOOGLE_PROJECT_ID}
      MB_ALERTA_WS_BACKEND_GS_BUCKET_NAME: ${MB_ALERTA_WS_BACKEND_GS_BUCKET_NAME}
      MB_ALERTA_WS_ALERT_IMAGES_GS_BUCKET_NAME: ${MB_ALERTA_WS_ALERT_IMAGES_GS_BUCKET_NAME}
      MB_ALERTA_ALERT_IMAGES_PNG_BASE_URL: ${MB_ALERTA_ALERT_IMAGES_PNG_BASE_URL}
      MB_ALERTA_DASHBOARD_GRAPHQL_URL: ${MB_ALERTA_DASHBOARD_GRAPHQL_URL}
      MB_ALERTA_DASHBOARD_EMAIL: ${MB_ALERTA_DASHBOARD_EMAIL}
      MB_ALERTA_DASHBOARD_PASSWORD: ${MB_ALERTA_DASHBOARD_PASSWORD}
      MB_ALERTA_WS_SMTP_HOST: ${MB_ALERTA_WS_SMTP_HOST}
      MB_ALERTA_WS_SMTP_PORT: ${MB_ALERTA_WS_SMTP_PORT}
      MB_ALERTA_WS_SMTP_SECURE: ${MB_ALERTA_WS_SMTP_SECURE}
      MB_ALERTA_WS_SMTP_USER: ${MB_ALERTA_WS_SMTP_USER}
      MB_ALERTA_WS_SMTP_PASS: ${MB_ALERTA_WS_SMTP_PASS}
      MB_ALERTA_WS_MAIL_FROM: ${MB_ALERTA_WS_MAIL_FROM}
      MB_ALERTA_WS_FRONTEND_URL: ${MB_ALERTA_WS_FRONTEND_URL}
      MB_ALERTA_PLANET_GEE_ASSET_COLLECTION: ${MB_ALERTA_PLANET_GEE_ASSET_COLLECTION}
      SCCON_API_BASE_URL: ${SCCON_API_BASE_URL}
      SCCON_USERNAME: ${SCCON_USERNAME}
      SCCON_PASSWORD: ${SCCON_PASSWORD}

    logging:
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - mapbiomas-alertas-workspace

    ports:
      - "${MB_ALERTA_WS_BACKEND_PORT}"

networks:
  mapbiomas-alertas-workspace:
    name: mapbiomas-alertas-workspace
    driver: bridge
