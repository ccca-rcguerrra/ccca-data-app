version: "3.5"

services:

  mapbiomas-alertas-workspace-redis-staging:
    image: bitnami/redis:7.2.2
    container_name: mapbiomas-alertas-workspace-redis-staging
    hostname: mapbiomas-alertas-workspace-redis-staging
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    ports:
      - "6379"

    networks:
      - mapbiomas-alertas-workspace

